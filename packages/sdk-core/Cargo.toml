[package]
name = "agentkern-sdk-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "AgentKern SDK Core - Liability Proofs and Agent Cryptography"
repository = "https://github.com/agentkern/agentkern"
keywords = ["ai-agents", "cryptography", "liability", "sdk"]
categories = ["cryptography", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Cryptography (ring - AWS libcrypto base, production-grade)
ring = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error Handling
thiserror = { workspace = true }

# Encoding
base64 = "0.22"

# Time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Async (for future compatibility)
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
temp-env = { workspace = true }

[features]
default = []
# Enable for WASM compatibility (future)
wasm = []
# Enable for UniFFI bindings generation
uniffi = []
