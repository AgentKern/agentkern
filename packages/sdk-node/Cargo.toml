[package]
name = "agentkern-sdk-node"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "AgentKern SDK Node.js Bindings via N-API"
repository = "https://github.com/agentkern/agentkern"

[lib]
crate-type = ["cdylib"]

[dependencies]
# N-API bindings
napi = { version = "2.16", default-features = false, features = ["napi9", "async", "serde-json"] }
napi-derive = "2.16"

# SDK Core
agentkern-sdk-core = { path = "../sdk-core" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Encoding
base64 = "0.22"

# Time
chrono = { workspace = true }

# Async runtime
tokio = { workspace = true }

[build-dependencies]
napi-build = "2.1"

[profile.release]
lto = true
strip = "symbols"
