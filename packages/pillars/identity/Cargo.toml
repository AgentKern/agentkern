[package]
name = "agentkern-identity"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
# Async Runtime
tokio = { workspace = true }

# Web Framework
axum = { version = "0.8.8", features = ["macros"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }
base64 = "0.22"
webauthn-rs = "0.5"
thiserror = { workspace = true }
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"

# Internal
agentkern-crypto = { path = "../../foundation/crypto" }
agentkern-gate = { path = "../gate" }
agentkern-nexus = { path = "../nexus" }
async-trait = { workspace = true }

