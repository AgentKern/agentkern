[package]
name = "agentkern-identity"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async Runtime
tokio = { version = "1.36", features = ["full"] }

# Web Framework
axum = { version = "0.8.1", features = ["macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json"] }

# Utilities
uuid = { version = "1.11.0", features = ["serde", "v4"] }
chrono = { version = "0.4.39", features = ["serde"] }
base64 = "0.22"
webauthn-rs = "0.5"
thiserror = "2.0.11"
tracing = "0.1"

# Internal
agentkern-crypto = { path = "../../foundation/crypto" }
agentkern-nexus = { path = "../nexus" } # Reusing AgentCard/Protocol types if needed
