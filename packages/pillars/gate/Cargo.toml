[package]
name = "agentkern-gate"
version = "0.1.0"
edition = "2024"
description = "AgentKern-Gate: Neuro-Symbolic Verification Engine"
license = "Apache-2.0"

[lints]
workspace = true

[lib]
name = "agentkern_gate"
path = "src/lib.rs"

[[bin]]
name = "gate-server"
path = "src/bin/server.rs"

[[bin]]
name = "gate-cli"
path = "src/bin/policy-cli.rs"

[features]
default = ["sql"]
io_uring = ["tokio-uring"]
wasm = ["wasmtime"]
neural = ["ort", "ndarray"]
actors = ["actix"]
# Post-Quantum cryptography (NIST FIPS 203/204)
pqc = ["pqcrypto-mlkem", "pqcrypto-traits", "pqcrypto-mldsa"]
# SQL Connector
sql = ["sqlx"]
# OpenTelemetry distributed tracing
otel = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "tracing-opentelemetry"]
# HTTP client for production API calls (SWIFT, etc.)
http = ["reqwest"]
# SAP NW RFC SDK bindings (requires licensed SDK installation)
sap-rfc = []
# Full feature set
# Full feature set
full = ["io_uring", "wasm", "neural", "actors", "pqc", "sql", "otel", "http", "redis", "compliance", "esg"]
redis = ["dep:redis", "dep:bb8", "dep:bb8-redis"]
# Specialized Compliance & ESG features (Opt-in only)
compliance = [] # HIPAA, Shariah, PCI
esg = [] # Carbon Veto

[dependencies]
# Async runtime (Dec 2025 - verified tokio 1.48.0)
tokio = { version = "1.48", features = ["full"] }
tokio-uring = { version = "0.5", optional = true }
async-trait = "0.1"

# Serialization
serde = { version = "1.0.216", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.133"

# WASM Component Model (Dec 25, 2025 - wasmtime 40.0.0)
wasmtime = { version = "40.0", optional = true }

# ONNX Runtime for Neural path
ort = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }

# BPE Tokenizer (Dec 2025 - replaces SimpleTokenizer for OOV resistance)
# Uses cl100k_base encoding (100K tokens, GPT-4 compatible)
tiktoken-rs = "0.9"

# Actor framework
actix = { version = "0.13", optional = true }

# HTTP server (Dec 2025 - axum 0.8.8)
axum = "0.8.8"
tower = { version = "0.5", features = ["limit", "buffer", "util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# Tracing/observability
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# OpenTelemetry (Dec 2025 - distributed tracing)
# Feature-gated for optional OTLP export to Jaeger/Tempo
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.31", features = ["http-proto"], optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }

# HTTP client for production API calls (SWIFT GPI, etc.)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }

# Error handling (Dec 2025)
thiserror = "2.0"
anyhow = "1.0.101"

# ============================================================
# CRYPTO-AGILITY: Classical + Post-Quantum (NIST FIPS 203/204)
# ============================================================

# Classical cryptography (always enabled)
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
# Upgraded to 0.9 for rand_core 0.9 compatibility with ML-KEM (FIPS 203)
rand = "0.9"
sha2 = "0.10.8"
base64 = "0.22"

# Post-Quantum cryptography (feature-gated, NIST FIPS 203/204)
# CRITICAL: Required for 2027+ quantum threat mitigation
# ML-KEM (FIPS 203) for key encapsulation - replaces RSA/ECDH
pqcrypto-mlkem = { version = "0.1", optional = true }
pqcrypto-traits = { version = "0.3.5", optional = true }
# ML-DSA (FIPS 204) for digital signatures - replaces RSA/ECDSA  
pqcrypto-mldsa = { version = "0.1", optional = true }

# Internal dependencies
agentkern-governance = { path = "../../foundation/governance" }
agentkern-treasury = { path = "../treasury" }

# Database (Dec 2025 - via workspace)
# NOTE: MySQL disabled to avoid RSA Marvin Attack vulnerability (RUSTSEC-2023-0071)
# We use PostgreSQL for production deployments
sqlx = { workspace = true, optional = true, features = ["runtime-tokio", "tls-rustls", "any", "postgres", "sqlite"] }

# UUID for policy IDs
uuid = { version = "1.21", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4.43", features = ["serde"] }

# Concurrent data structures
parking_lot = "0.12.3"
once_cell = "1.20"

# Normalization for adversarial defense
unicode-normalization = "0.1"
deunicode = "1.6"

# Redis Caching (Phase 20)
redis = { version = "0.27", features = ["tokio-comp"], optional = true }
bb8 = { version = "0.8", optional = true }
bb8-redis = { version = "0.17", optional = true }
dashmap = "6.1.0"
clap = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
# Note: default-features = false to avoid RUSTSEC-2026-0001 (rkyv vulnerability)
rust_decimal = { version = "1.40", default-features = false, features = ["serde", "std"] }
rust_decimal_macros = "1.40"
wat = "1.245"  # For WASM integration tests
tempfile = "3.25"

[[bench]]
name = "policy_eval"
harness = false
