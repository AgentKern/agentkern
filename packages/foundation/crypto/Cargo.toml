[package]
name = "agentkern-crypto"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "AgentKern Crypto: Unified quantum-safe cryptographic primitives"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tracing = "0.1.41"
uuid = { version = "1.19", features = ["v4", "serde"] }
base64 = "0.22.1"
ed25519-dalek = "2.1.0"
rand = "0.9"
sha2 = "0.10.8"
pqcrypto-mlkem = { version = "0.1", optional = true }
pqcrypto-traits = { version = "0.3", optional = true }

[features]
default = []
pqc = ["pqcrypto-mlkem", "pqcrypto-traits"]
