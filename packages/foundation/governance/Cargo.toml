[package]
name = "agentkern-governance"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "AgentKern Governance: Unified compliance and regulatory framework"
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
std = ["serde/std", "serde_json/std", "tracing"]
# WASM-compatible minimal mode
wasm = []

[dependencies]
async-trait = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
thiserror = "2.0.18"
tracing = { version = "0.1.41", optional = true }
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
# Note: default-features = false to avoid RUSTSEC-2026-0001 (rkyv vulnerability)
rust_decimal = { version = "1.41", default-features = false, features = ["serde", "std"] }
rust_decimal_macros = "1.40"
regex = "1.12"
tokio = { version = "1.50", features = ["sync"] }
