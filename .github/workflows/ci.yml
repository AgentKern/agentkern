name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 'stable'
  PNPM_VERSION: '9'
  PYO3_PYTHON: python3

jobs:
  # ============================================
  # Rust Gate Tests
  # ============================================
  gate-test:
    name: Gate Tests (Rust)
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpython3-dev pkg-config
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Check formatting
        run: cargo fmt --all --check
      
      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings
      
      - name: Run tests
        run: cargo test --workspace --all-features -- --test-threads=1

  # ============================================
  # Identity Pillar Tests (Rust - agentkern-server)
  # ============================================
  identity-test:
    name: Identity Tests (Rust)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-identity-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Identity Tests
        run: cargo test -p agentkern-identity

      - name: Build agentkern-server
        run: cargo build -p agentkern-server --release

  # ============================================
  # Identity E2E Tests (Rust Server API)
  # ============================================
  identity-e2e:
    name: Identity E2E Tests (Rust)
    runs-on: ubuntu-latest
    needs: [identity-test]
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentkern
          POSTGRES_PASSWORD: agentkern_secret
          POSTGRES_DB: agentkern_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('Cargo.lock') }}

      - name: Build agentkern-server
        run: cargo build -p agentkern-server --release

      - name: Run migrations
        run: |
          DATABASE_URL="postgres://agentkern:agentkern_secret@localhost:5432/agentkern_identity" \
          cargo run --bin migrate
        
      - name: Start Server & Health Check
        run: |
          DATABASE_URL="postgres://agentkern:agentkern_secret@localhost:5432/agentkern_identity" \
          ./target/release/agentkern-server > server.log 2>&1 &
          
          echo "Waiting for server to be healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/health | grep -q "healthy"; then
              echo "Server is healthy!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          
          if ! curl -s http://localhost:3000/health | grep -q "healthy"; then
            echo "Server failed to become healthy. Logs:"
            cat server.log
            exit 1
          fi

      - name: Run API Tests
        run: |
          echo "Testing Root Health..."
          curl -sf http://localhost:3000/health
          echo "Testing Identity Health..."
          curl -sf http://localhost:3000/api/v1/identity/health
          echo "Testing Gate Health..."
          curl -sf http://localhost:3000/api/v1/gate/health
          echo "Testing All Pillars..."
          curl -sf http://localhost:3000/api/v1/arbiter/health
          curl -sf http://localhost:3000/api/v1/nexus/health
          curl -sf http://localhost:3000/api/v1/synapse/health
          curl -sf http://localhost:3000/api/v1/treasury/health
          echo "All E2E tests passed!"
      
      - name: E2E Test Summary
        if: always()
        run: |
          echo "## 🧪 E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Rust agentkern-server tested. All 6 pillars verified." >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Build Playground
  # ============================================
  playground-build:
    name: Playground Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build Playground
        working-directory: apps/playground
        run: pnpm build
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: playground-dist
          path: apps/playground/dist

  # ============================================
  # Docker Build (agentkern-server)
  # ============================================
  docker-build:
    name: Docker Build (Rust Server)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build agentkern-server Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: agentkern/server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Rust Coverage
  # ============================================
  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
          key: ${{ runner.os }}-cargo-tarpaulin-${{ hashFiles('Cargo.lock') }}
      
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin || true
      
      - name: Run coverage
        run: cargo tarpaulin --workspace --out Html --output-dir coverage
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: coverage
