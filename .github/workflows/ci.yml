name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 'stable'
  PNPM_VERSION: '9'
  PYO3_PYTHON: python3

jobs:
  # ============================================
  # Rust Gate Tests
  # ============================================
  gate-test:
    name: Gate Tests (Rust)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: agentkern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpython3-dev pkg-config
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      
      - name: Check formatting
        run: cargo fmt --all --check
      
      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run Migrations (Arbiter)
        env:
          DATABASE_URL: "postgres://postgres:root@localhost:5432/agentkern_test"
        run: sqlx migrate run --source packages/pillars/arbiter/migrations --ignore-missing
      
      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings
      
      - name: Run tests
        env:
          DATABASE_URL: "postgres://postgres:root@localhost:5432/agentkern_test"
          JWT_SECRET: "agentkern-dev-secret-DO-NOT-USE-IN-PRODUCTION"
        run: cargo test --workspace --all-features -- --test-threads=1

  # ============================================
  # Identity Pillar Tests (Rust - agentkern-server)
  # ============================================
  identity-test:
    name: Identity Tests (Rust)
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run Identity Tests
        run: cargo test -p agentkern-identity

      - name: Build agentkern-server
        run: cargo build -p agentkern-server --release --no-default-features

  # ============================================
  # Identity E2E Tests (Rust Server API)
  # ============================================
  identity-e2e:
    name: Identity E2E Tests (Rust)
    runs-on: ubuntu-latest
    needs: [identity-test]
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: agentkern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build agentkern-server
        run: cargo build -p agentkern-server --release

      # Removed redundant migration step as server handles it on startup.
        
      - name: Start Server & Health Check
        env:
          DATABASE_URL: "postgres://postgres:root@localhost:5432/agentkern_test"
          JWT_SECRET: "agentkern-dev-secret-DO-NOT-USE-IN-PRODUCTION"
        run: |
          ./target/release/agentkern-server > server.log 2>&1 &
          
          echo "Waiting for server to be healthy... (target http://localhost:3000/health)"
          for i in {1..30}; do
            if curl -s http://localhost:3000/health | grep -q "ok"; then
              echo "Server is healthy!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          
          if ! curl -s http://localhost:3000/health | grep -q "ok"; then
            echo "Server failed to become healthy. Logs:"
            cat server.log
            exit 1
          fi

      - name: Run API Tests
        run: |
          echo "Testing Root Health..."
          curl -sf http://localhost:3000/health
          echo "Testing Identity Health..."
          curl -sf http://localhost:3000/api/v1/identity/health
          echo "Testing Gate Health..."
          curl -sf http://localhost:3000/api/v1/gate/health
          echo "Testing All Pillars..."
          curl -sf http://localhost:3000/api/v1/arbiter/health
          curl -sf http://localhost:3000/api/v1/nexus/health
          curl -sf http://localhost:3000/api/v1/synapse/health
          curl -sf http://localhost:3000/api/v1/treasury/health
          echo "All E2E tests passed!"
      
      - name: E2E Test Summary
        if: always()
        run: |
          echo "## 🧪 E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "Rust agentkern-server tested. All 6 pillars verified." >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Build Playground
  # ============================================
  playground-build:
    name: Playground Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build Playground
        working-directory: apps/playground
        run: pnpm build
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: playground-dist
          path: apps/playground/dist

  # ============================================
  # Docker Build (agentkern-server)
  # ============================================
  docker-build:
    name: Docker Build (Rust Server)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build agentkern-server Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: agentkern/server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Rust Coverage
  # ============================================
  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: agentkern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin
      
      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run Migrations (Unified)
        env:
          DATABASE_URL: "postgres://postgres:root@localhost:5432/agentkern_test"
        run: cargo run -p agentkern-server --bin migrate

      - name: Run coverage
        env:
          DATABASE_URL: "postgres://postgres:root@localhost:5432/agentkern_test"
          JWT_SECRET: "agentkern-dev-secret-DO-NOT-USE-IN-PRODUCTION"
        run: cargo tarpaulin --verbose --workspace --timeout 300 --out Html --output-dir coverage -- --test-threads 1
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: coverage
