name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true
        type: string
      publish_crates:
        description: 'Publish Rust crates to crates.io (requires CRATES_IO_TOKEN)'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 'stable'

jobs:
  # ============================================
  # Build Release Artifacts
  # ============================================
  build:
    name: Build Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Install cross (for cross-compilation)
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      
      - name: Build Server Binary
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cargo build --release --bin agentkern-server
          else
            cross build --release --target ${{ matrix.target }} --bin agentkern-server
          fi
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentkern-server-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/agentkern-server*
            target/release/agentkern-server*
          retention-days: 30

  # ============================================
  # Create GitHub Release
  # ============================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Extract Version
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/v(.*) ]]; then
            echo "version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate Release Notes
        id: release_notes
        run: |
          cat > release_notes.md << EOF
          # AgentKern v${{ steps.version.outputs.version }}
          
          ## What's Changed
          
          See [CHANGELOG.md](https://github.com/AgentKern/agentkern/blob/v${{ steps.version.outputs.version }}/CHANGELOG.md) for full details.
          
          ## Installation
          
          \`\`\`bash
          # From source
          cargo install --git https://github.com/AgentKern/agentkern --tag v${{ steps.version.outputs.version }} agentkern-server
          
          # Or download binaries from assets below
          \`\`\`
          
          ## Downloads
          
          Pre-built binaries are available for:
          - Linux (x86_64)
          - macOS (x86_64)
          - Windows (x86_64)
          
          See assets below.
          EOF
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AgentKern v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            target/*/release/agentkern-server*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Publish to crates.io (if applicable)
  # ============================================
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        crate:
          - agentkern-gate
          - agentkern-synapse
          - agentkern-arbiter
          - agentkern-nexus
          - agentkern-treasury
          - agentkern-identity
          - agentkern-runtime
          - agentkern-edge
          - agentkern-parsers
          - agentkern-governance
          - agentkern-pulse
          - agentkern-sdk-core
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Validate crate publishability (dry-run)
        run: |
          cargo publish --dry-run -p "${{ matrix.crate }}"

      - name: Publish crate to crates.io
        if: github.event_name == 'workflow_dispatch' && inputs.publish_crates == true
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CRATES_IO_TOKEN" ]; then
            echo "CRATES_IO_TOKEN is required when publish_crates=true"
            exit 1
          fi
          cargo publish -p "${{ matrix.crate }}" --token "$CRATES_IO_TOKEN"
