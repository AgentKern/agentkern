name: Security Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am

permissions:
  contents: read
  security-events: write

env:
  PYO3_PYTHON: python3
  RUSTFLAGS: "-C link-arg=-Wl,-rpath,/usr/lib/x86_64-linux-gnu"

jobs:
  # =========================================================================
  # Rust Dependency Audit
  # =========================================================================
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
        
      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run audit
        run: |
          cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0001 \
            --ignore RUSTSEC-2024-0384 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0012 \
            --ignore RUSTSEC-2025-0141 \
            --format sarif > cargo-audit.sarif || true
        
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: cargo-audit.sarif
          category: cargo-audit

  # =========================================================================
  # SAST with Semgrep
  # =========================================================================
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/rust
            p/typescript
            p/security-audit
            p/secrets
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}

  # =========================================================================
  # Secret Scanning
  # =========================================================================
  trufflehog:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Scan commit range on PRs only, use max-depth for push events
          extra_args: --only-verified ${{ github.event_name == 'pull_request' && format('--since-commit={0}', github.event.pull_request.base.sha) || '--max-depth=50' }}

  # =========================================================================
  # Rust Tests with Coverage
  # =========================================================================
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentkern
          POSTGRES_PASSWORD: agentkern_secret
          POSTGRES_DB: agentkern_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentkern"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - uses: actions/checkout@v6
      
      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libpython3-dev pkg-config
        
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
        
      - name: Run migrations
        run: |
          DATABASE_URL="postgres://agentkern:agentkern_secret@localhost:5432/agentkern_identity" \
          cargo run --bin migrate
          echo "Migrations completed successfully"
        
      - name: Run tests with coverage
        run: |
          DATABASE_URL="postgres://agentkern:agentkern_secret@localhost:5432/agentkern_identity" \
          cargo llvm-cov test --workspace \
            --lcov --output-path lcov.info \
            --ignore-filename-regex 'target|tests?/'
            
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false

  # =========================================================================
  # TypeScript Security (Identity Service)
  # =========================================================================
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/playground
    steps:
      - uses: actions/checkout@v6
      
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run audit
        run: pnpm audit --audit-level=high
        
      - name: Run ESLint security
        continue-on-error: true
        run: pnpm lint
