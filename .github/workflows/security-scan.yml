name: Security Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am

permissions:
  contents: read
  security-events: write

jobs:
  # =========================================================================
  # Rust Dependency Audit
  # =========================================================================
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install cargo-audit
        run: cargo install cargo-audit
        
      - name: Run audit
        run: cargo audit --deny warnings --ignore RUSTSEC-2026-0001
        
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cargo-audit.sarif

  # =========================================================================
  # SAST with Semgrep
  # =========================================================================
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/rust
            p/typescript
            p/security-audit
            p/secrets
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}

  # =========================================================================
  # Secret Scanning
  # =========================================================================
  trufflehog:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Scan commit range on PRs only, use max-depth for push events
          extra_args: --only-verified ${{ github.event_name == 'pull_request' && format('--since-commit={0}', github.event.pull_request.base.sha) || '--max-depth=50' }}

  # =========================================================================
  # Rust Tests with Coverage
  # =========================================================================
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
        
      - name: Run tests with coverage
        run: |
          cargo llvm-cov test --workspace \
            --lcov --output-path lcov.info \
            --ignore-filename-regex 'target|tests?/'
            
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # =========================================================================
  # TypeScript Security (Identity Service)
  # =========================================================================
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/identity
    steps:
      - uses: actions/checkout@v6
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Run audit
        run: pnpm audit --audit-level=high
        
      - name: Run ESLint security
        run: pnpm lint
