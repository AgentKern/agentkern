name: Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  PYO3_PYTHON: python3

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: agentkern_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 4096
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpython3-dev pkg-config

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Run Migrations (Unified)
        env:
          DATABASE_URL: "postgres://postgres:root@localhost:5432/agentkern_test"
        run: cargo run -p agentkern-server --bin migrate

      - name: Generate Code Coverage (Stateless Units)
        env:
          DATABASE_URL: "postgres://postgres:root@localhost:5432/agentkern_test"
          JWT_SECRET: "agentkern-dev-secret-DO-NOT-USE-IN-PRODUCTION"
        run: |
          cargo llvm-cov --workspace --exclude agentkern-arbiter --exclude agentkern-identity --exclude agentkern-server --no-report

      - name: Generate Code Coverage (Serial Integration)
        env:
          DATABASE_URL: "postgres://postgres:root@localhost:5432/agentkern_test"
          JWT_SECRET: "agentkern-dev-secret-DO-NOT-USE-IN-PRODUCTION"
        run: |
          cargo llvm-cov -p agentkern-arbiter -p agentkern-identity -p agentkern-server --no-report -- --test-threads 1

      - name: Generate LCOV Report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true
          slug: AgentKern/agentkern
