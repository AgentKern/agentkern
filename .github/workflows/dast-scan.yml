# AgentKern - Dynamic Application Security Testing (DAST) Workflow
#
# This workflow implements OWASP ZAP DAST scanning following 2026 best practices:
# - Runs on staging/preview deployments (not production)
# - Generates SARIF reports for GitHub Security tab integration
# - Creates issues for high-severity findings
# - Supports authenticated and API scanning
#
# References:
# - OWASP ZAP GitHub Actions: https://github.com/zaproxy
# - OWASP Testing Guide 2026
# - DAST in CI/CD Best Practices

name: DAST Security Scan

on:
  # Run when deployment to staging completes
  deployment_status:
    types: [success]
  # Weekly scheduled scan (Monday 3 AM UTC)
  schedule:
    - cron: '0 3 * * 1'
  # Manual trigger for ad-hoc scanning
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan'
        required: true
        default: 'http://localhost:3000'
      scan_type:
        description: 'Scan type: baseline, api, full'
        required: true
        default: 'baseline'
        type: choice
        options:
          - baseline
          - api
          - full

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  dast-scan:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    # Only run on staging deployments or manual trigger
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && 
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'staging')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set target URL
        id: target
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "url=${{ github.event.inputs.target_url }}" >> $GITHUB_OUTPUT
            echo "scan_type=${{ github.event.inputs.scan_type }}" >> $GITHUB_OUTPUT
          else
            echo "url=${{ github.event.deployment_status.target_url }}" >> $GITHUB_OUTPUT
            echo "scan_type=baseline" >> $GITHUB_OUTPUT
          fi

      # ==========================================================================
      # Baseline Scan - Fast passive scan (~5 minutes)
      # Good for PR checks and quick feedback
      # ==========================================================================
      - name: OWASP ZAP Baseline Scan
        if: steps.target.outputs.scan_type == 'baseline'
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: true
          issue_title: 'DAST: ZAP Baseline Scan Report'
          fail_action: false
          artifact_name: 'zap-baseline-report'

      # ==========================================================================
      # API Scan - Scan OpenAPI/Swagger definitions
      # Per 2026 best practices: API security is critical
      # ==========================================================================
      - name: OWASP ZAP API Scan
        if: steps.target.outputs.scan_type == 'api'
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: ${{ steps.target.outputs.url }}/api/docs-json
          format: openapi
          rules_file_name: '.zap/api-rules.tsv'
          allow_issue_writing: true
          issue_title: 'DAST: ZAP API Scan Report'
          fail_action: false
          artifact_name: 'zap-api-report'

      # ==========================================================================
      # Full Scan - Comprehensive active scan (~30+ minutes)
      # Run weekly or before major releases
      # ==========================================================================
      - name: OWASP ZAP Full Scan
        if: steps.target.outputs.scan_type == 'full'
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: true
          issue_title: 'DAST: ZAP Full Scan Report'
          fail_action: false
          artifact_name: 'zap-full-report'

      # ==========================================================================
      # Upload SARIF to GitHub Security Tab
      # Enables vulnerability tracking in GitHub's security dashboard
      # ==========================================================================
      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'zap-report.sarif'
          category: 'dast-zap'

      # ==========================================================================
      # Archive All Reports
      # ==========================================================================
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-reports-${{ github.run_id }}
          path: |
            zap-report.html
            zap-report.json
            zap-report.sarif
          retention-days: 30

  # ==========================================================================
  # Scheduled Full Scan - Weekly comprehensive security check
  # Per 2026 best practices: Continuous Exposure Management
  # ==========================================================================
  scheduled-full-scan:
    name: Scheduled Full DAST Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: OWASP ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: ${{ vars.STAGING_URL || 'https://staging.agentkern.dev' }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: true
          issue_title: 'DAST: Weekly Security Scan Report'
          fail_action: false

      - name: Upload SARIF Report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'zap-report.sarif'
          category: 'dast-scheduled'
