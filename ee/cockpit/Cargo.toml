[package]
name = "agentkern-cockpit"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-AgentKern-Enterprise"
description = "AgentKern Enterprise: Cockpit Dashboard"
repository = "https://github.com/agentkern/agentkern"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
agentkern-pulse = { path = "../../packages/foundation/pulse" }
agentkern-nexus = { path = "../../packages/pillars/nexus" }
agentkern-synapse = { path = "../../packages/pillars/synapse" }
agentkern-gate = { path = "../../packages/pillars/gate" }
prometheus = "0.14"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
temp-env = { workspace = true }
