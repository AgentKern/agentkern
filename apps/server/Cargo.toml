[package]
name = "agentkern-server"
version = "0.1.0"
edition = "2021"
description = "Unified AgentKern OS Server - Gateway to all pillars"
license.workspace = true

[[bin]]
name = "agentkern-server"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[dependencies]
# Async Runtime
tokio = { workspace = true, features = ["full"] }

# Web Framework
axum = { workspace = true, features = ["macros"] }
tower = { version = "0.5", features = ["util", "timeout", "limit", "load-shed", "steer", "filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Configuration
dotenvy = "0.15"

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Database
# Use workspace version for consistency
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls"] }

# JWT Authentication
jsonwebtoken = "9"
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }

# Password Hashing (Production Security)
bcrypt = "0.17"
argon2 = "0.5"

# OpenTelemetry (Modern Suite 0.27)
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "grpc-tonic"] }
opentelemetry-http = "0.27"
tracing-opentelemetry = "0.28"

# Random
rand = { workspace = true }
base64 = { workspace = true }
redis = { workspace = true }
aws-config = { workspace = true }
aws-sdk-kms = { workspace = true }

# Pillars
agentkern-identity = { path = "../../packages/pillars/identity" }
agentkern-gate = { path = "../../packages/pillars/gate" }
agentkern-arbiter = { path = "../../packages/pillars/arbiter" }
agentkern-nexus = { path = "../../packages/pillars/nexus" }
agentkern-synapse = { path = "../../packages/pillars/synapse" }
# Enterprise Pillars
agentkern-treasury = { path = "../../packages/pillars/treasury" }
# Enterprise Pillars
