[package]
name = "agentkern-server"
version = "0.1.0"
edition = "2021"
description = "Unified AgentKern OS Server - Gateway to all pillars"
license.workspace = true

[[bin]]
name = "agentkern-server"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[dependencies]
# Async Runtime
tokio = { version = "1.36", features = ["full"] }

# Web Framework
axum = { version = "0.8.1", features = ["macros"] }
tower = { version = "0.5", features = ["util", "timeout", "limit", "load-shed", "steer", "filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }



# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dotenvy = "0.15"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls"] }

# JWT Authentication
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

# Password Hashing (Production Security)
bcrypt = "0.17"
argon2 = "0.5"
opentelemetry = "0.22"
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp = "0.15"
tracing-opentelemetry = "0.23"
rand = "0.8"
base64 = { workspace = true }
redis = { workspace = true }
aws-config = { workspace = true }
aws-sdk-kms = { workspace = true }

# Pillars
agentkern-identity = { path = "../../packages/pillars/identity" }
agentkern-gate = { path = "../../packages/pillars/gate" }
agentkern-arbiter = { path = "../../packages/pillars/arbiter" }
agentkern-nexus = { path = "../../packages/pillars/nexus" }
agentkern-synapse = { path = "../../packages/pillars/synapse" }
# Enterprise Pillars
agentkern-treasury = { path = "../../packages/pillars/treasury" }
agentkern-cloud = { path = "../../ee/cloud" }
agentkern-trust = { path = "../../ee/trust" }
agentkern-energy-ee = { path = "../../ee/energy" }
agentkern-sovereign-memory-ee = { path = "../../ee/sovereign-memory" }
