rules:
  # =========================================================================
  # SQL & Database Security
  # =========================================================================
  - id: nestjs-raw-query
    patterns:
      - pattern: $REPO.query(...)
      - pattern-not: $REPO.query("...", ...)
    message: "Potential SQL injection: raw query used with non-literal string."
    languages: [typescript]
    severity: ERROR

  # =========================================================================
  # Injection & XSS
  # =========================================================================
  - id: nestjs-unsafe-redirect
    pattern: $RES.redirect($REQ.query.$PARAM)
    message: "Potential Open Redirect: redirecting based on user input."
    languages: [typescript]
    severity: WARNING

  - id: dangerous-innerHTML
    pattern: $X.innerHTML = $Y
    message: "Potential XSS: innerHTML assignment with untrusted data."
    languages: [typescript, javascript]
    severity: WARNING

  - id: eval-usage
    pattern: eval(...)
    message: "Dangerous eval() usage: can lead to code injection."
    languages: [typescript, javascript]
    severity: ERROR

  - id: function-constructor
    pattern: new Function(...)
    message: "Dangerous Function constructor: equivalent to eval()."
    languages: [typescript, javascript]
    severity: ERROR

  # =========================================================================
  # Secrets & Credentials
  # =========================================================================
  - id: hardcoded-secret-assignment
    pattern: |
      $X = "$SECRET";
    metavariable-regex:
      metavariable: $SECRET
      regex: (^[a-zA-Z0-9+/]{32,}|^[0-9a-z]{40,}|.*[Kk]ey.*|.*[Ss]ecret.*)
    message: "Potential hardcoded secret assigned to variable."
    languages: [typescript, javascript, yaml]
    severity: WARNING

  - id: hardcoded-jwt-secret
    pattern: |
      jwt.sign($PAYLOAD, "$SECRET", ...)
    message: "Hardcoded JWT secret: use environment variable instead."
    languages: [typescript, javascript]
    severity: ERROR

  # =========================================================================
  # Cookie & Session Security
  # =========================================================================
  - id: insecure-cookie-setting
    pattern: |
      res.cookie(..., { ..., httpOnly: false, ... })
    message: "Insecure cookie: httpOnly should be set to true."
    languages: [typescript]
    severity: WARNING

  - id: insecure-cookie-secure
    pattern: |
      res.cookie(..., { ..., secure: false, ... })
    message: "Insecure cookie: secure should be true in production."
    languages: [typescript]
    severity: WARNING

  # =========================================================================
  # CORS & Headers
  # =========================================================================
  - id: insecure-cors-origin
    pattern: origin: '*'
    message: "Insecure CORS configuration: allowing all origins."
    languages: [typescript, yaml]
    severity: WARNING

  # =========================================================================
  # Path Traversal & File Access
  # =========================================================================
  - id: path-traversal-fs
    patterns:
      - pattern-either:
          - pattern: fs.readFileSync($PATH, ...)
          - pattern: fs.readFile($PATH, ...)
          - pattern: fs.writeFileSync($PATH, ...)
          - pattern: fs.writeFile($PATH, ...)
      - pattern-not: fs.$FUNC("...", ...)
    message: "Potential path traversal: validate file path before file operations."
    languages: [typescript, javascript]
    severity: WARNING

  # =========================================================================
  # Prototype Pollution
  # =========================================================================
  - id: prototype-pollution-merge
    pattern: Object.assign({}, $UNTRUSTED)
    message: "Potential prototype pollution: validate input before merging."
    languages: [typescript, javascript]
    severity: WARNING

  # =========================================================================
  # Information Leakage
  # =========================================================================
  - id: unsafe-json-parse
    pattern: JSON.parse($X)
    message: "Unsafe JSON parsing: ensure $X is validated before parsing."
    languages: [typescript]
    severity: INFO

  - id: console-log-sensitive
    pattern: console.log(..., $PASSWORD, ...)
    metavariable-regex:
      metavariable: $PASSWORD
      regex: .*(password|secret|token|key|credential).*
    message: "Potential sensitive data in console.log."
    languages: [typescript, javascript]
    severity: WARNING

  # =========================================================================
  # Missing Security Controls
  # =========================================================================
  - id: controller-missing-guard
    patterns:
      - pattern: |
          @Controller(...)
          class $CLASS { ... }
      - pattern-not: |
          @UseGuards(...)
          @Controller(...)
          class $CLASS { ... }
    message: "Controller without @UseGuards: consider adding authentication."
    languages: [typescript]
    severity: INFO

