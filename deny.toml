# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[licenses]
# List of allowed licenses (only include those actually used by dependencies)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    # webpki-roots uses this permissive data license
    "CDLA-Permissive-2.0",
    # AgentKern Enterprise License (internal packages)
    "LicenseRef-AgentKern-Enterprise",
    "MPL-2.0",
]

# Confidence threshold for detecting license text
confidence-threshold = 0.8

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"

# Allow by default
wildcards = "allow"

[advisories]
# SECURITY: No advisories ignored by default.
# All dependencies have been patched or configured to avoid known vulnerabilities.
# - RUSTSEC-2026-0001 (rkyv): Avoided by disabling default features on rust_decimal
# - RUSTSEC-2023-0071 (RSA Marvin Attack): Ignored in .cargo/audit.toml (sqlx-mysql only)
# - RUSTSEC-2025-0052 (async-std): Ignored in .cargo/audit.toml (redis dependency)
#
# See .cargo/audit.toml for detailed explanations of ignored advisories.
ignore = []

