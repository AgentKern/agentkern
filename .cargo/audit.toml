# cargo-audit configuration
# https://rustsec.org/advisories/
#
# This file configures which security advisories are ignored during audits.
# Each ignored advisory MUST have:
# 1. A detailed explanation of the vulnerability
# 2. Why it's safe to ignore temporarily
# 3. Mitigation steps we've taken
# 4. A link to track upstream progress
#
# ⚠️  Review this file regularly and remove ignores when fixes are available!

[advisories]
ignore = [
    # =========================================================================
    # RUSTSEC-2023-0071: RSA Marvin Attack
    # =========================================================================
    # Vulnerability: Timing side-channel in RSA decryption (Marvin Attack)
    # Severity: MEDIUM (CVSS 5.9)
    # Affected: rsa crate < 0.9.0 (used by sqlx-mysql for authentication)
    #
    # Why we're ignoring:
    # - We use Ed25519 for all agent signatures (not RSA)
    # - sqlx-mysql uses RSA only for MySQL server authentication
    # - Our production deployments use PostgreSQL (not MySQL)
    # - The attack requires local access and timing measurements
    #
    # Mitigation:
    # - Prefer PostgreSQL over MySQL in production
    # - Use TLS for database connections (enabled by default)
    # - Monitor https://github.com/RustCrypto/RSA/issues/19 for fix
    #
    # TODO: Remove when sqlx updates to rsa >= 0.9.0
    "RUSTSEC-2023-0071",
    
    # =========================================================================
    # RUSTSEC-2025-0052: async-std Discontinued
    # =========================================================================
    # Issue: async-std crate is discontinued and unmaintained
    # Severity: LOW (no active vulnerability, maintenance concern only)
    # Affected: async-std (transitive dependency via redis crate)
    #
    # Why we're ignoring:
    # - This is a maintenance advisory, not a security vulnerability
    # - redis crate uses async-std for async runtime features
    # - We use tokio as our primary runtime (not async-std)
    # - The redis team is aware and working on migration
    #
    # Mitigation:
    # - Monitor https://github.com/redis-rs/redis-rs for updates
    # - Consider alternative Redis clients if needed
    # - No immediate security risk from this dependency
    #
    # TODO: Remove when redis crate removes async-std dependency
    "RUSTSEC-2025-0052",
]
