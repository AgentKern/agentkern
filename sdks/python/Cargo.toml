[package]
name = "agentkern-python"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "AgentKern SDK Python Bindings via PyO3"
repository = "https://github.com/agentkern/agentkern"

[lib]
name = "agentkern"
crate-type = ["cdylib"]

[dependencies]
# PyO3 for Python bindings (>=0.24.1 required for RUSTSEC-2025-0020 fix)
# Validated for CI
pyo3 = { version = "0.24" }

# Build and Test SDKs
# Trigger build

# SDK Core
# SDK Core
agentkern-sdk-core = { path = "../core" }

# Pillars
agentkern-gate = { path = "../../packages/pillars/gate" }
agentkern-nexus = { path = "../../packages/pillars/nexus" }
agentkern-treasury = { path = "../../packages/pillars/treasury" }
agentkern-synapse = { path = "../../packages/pillars/synapse" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async (needed for GateEngine)
tokio = { version = "1.48", features = ["full"] }

# Encoding
base64 = "0.22"

# Time
chrono = { workspace = true }

# Fix for manylinux builds (openssl-sys requirement)
openssl = { version = "0.10", features = ["vendored"] }

[features]
extension-module = ["pyo3/extension-module"]
default = []

[build-dependencies]
pyo3-build-config = "0.24"
